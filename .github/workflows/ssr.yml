name: SSR baseline

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    paths:
      - '.gitignore'
      - 'backend/seed_dskp.py'
      - 'backend/tests/**'
      - 'ssr/**'
      - 'scripts/deploy-ssr.sh'
      - 'scripts/test-deploy-ssr.sh'
      - 'scripts/verify-ssr-production.sh'
      - 'scripts/test-verify-ssr-production.sh'
      - '.github/workflows/ssr.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ssr
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, intl, mbstring, pdo_sqlite, simplexml, sqlite3, xml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Initialize test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run legacy DSKP seed safety tests
        working-directory: .
        run: python3 -m unittest discover -s backend/tests -v

      - name: Validate deployment hook
        working-directory: .
        run: |
          bash -n scripts/deploy-ssr.sh
          bash -n scripts/verify-ssr-production.sh
          bash -n scripts/test-verify-ssr-production.sh
          bash scripts/test-deploy-ssr.sh
          bash scripts/test-verify-ssr-production.sh

      - name: Run SSR tests
        run: php artisan test

      - name: Verify migration round trip
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
