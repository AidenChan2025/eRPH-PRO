<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            border: 1px solid #ddd;
        }

        .header {
            background: #003366;
            padding: 30px;
            color: white;
        }

        .content {
            padding: 40px;
            font-size: 18px;
            line-height: 1.6;
        }

        .footer {
            background: #f9f9f9;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            border-top: 1px solid #eee;
        }

        .btn {
            background: #003366;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>eRPH Professional Update</h2>
        </div>
        <div class="content">
            <h3>{{ title }}</h3>
            {{ content_html }}
            <br><br>
            <a href="{{ action_link }}" class="btn">{{ action_text }}</a>
        </div>
        <div class="footer">
            Sent by eRPH Pro Administration
        </div>
    </div>
</body>

</html>
